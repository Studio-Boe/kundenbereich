<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>studio.Bö — Kundenportal (Prototyp)</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="fontlink-sans" href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500&display=swap" rel="stylesheet">
<link id="fontlink-serif" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;1,400&display=swap" rel="stylesheet">
<link id="fontlink-mono" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    /* oneplaze brand tokens (see Brand Guidelines v1.0) */
    --ink:#000000;
    --ink-soft:#2F2C29;
    --moss:#575C4F;
    --slate:#505F59;
    --sage:#ADB79E;
    --sage-pale:#CED4C5;
    --stone:#858783;
    --stone-light:#AEAFAC;
    --paper:#F9F9F9;
    --mist:#D6D7D6;

    /* app shell theme — defaults below match dark mode; overridden live via
       JS (see THEMES) once the person picks light/dark near their profile.
       Matches the "Your studio's dashboard" reference on oneplaze.io and
       Kim's Rio Technology mood board: ink base, hairline borders, sage
       as the one accent that pops. */
    --bg:#1A1816;
    --surface:transparent;
    --surface-warm:var(--sage-pale);
    --border:rgba(249,249,249,.1);
    --border-strong:rgba(249,249,249,.28);
    --text:var(--paper);
    --text-muted:var(--stone-light);
    --text-faint:var(--stone);
    --fill-strong:var(--paper);
    --fill-strong-text:var(--ink);
    --accent:var(--sage);
    --accent-soft:var(--sage-pale);
    --accent-text:var(--sage);
    --radius:6px;
    --radius-sm:4px;
    --radius-pill:100px;
    --font: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sidebar-w: 250px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--font); background:var(--bg); color:var(--text); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; position:relative; min-height:100vh;}
  html[data-theme="dark"] body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 1300px 800px at 50% 118%, rgba(173,183,158,.42), transparent 68%),
      radial-gradient(ellipse 700px 520px at 85% -10%, rgba(173,183,158,.14), transparent 60%),
      linear-gradient(115deg, transparent 38%, rgba(173,183,158,.08) 52%, transparent 66%);
    animation: appGlowBreathe 20s ease-in-out infinite;
  }
  @keyframes appGlowBreathe{0%,100%{opacity:.85;}50%{opacity:1;}}
  button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--accent-soft); color:var(--accent-text);}
  ::placeholder{color:var(--text-faint); opacity:1;}

  /* ---------- utility ---------- */
  .eyebrow{font-size:10.5px; text-transform:uppercase; letter-spacing:.2em; color:var(--text-faint); font-weight:400;}
  .muted{color:var(--text-muted);}
  .faint{color:var(--text-faint);}
  .hidden{display:none !important;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; justify-content:center;
    padding:9px 18px; border-radius:var(--radius-pill); border:1px solid var(--border-strong);
    background:transparent; font-weight:400; font-size:13px; cursor:pointer; transition:all .2s ease;
    white-space:nowrap; font-family:var(--font);
  }
  .btn:hover{background:var(--fill-strong); color:var(--fill-strong-text); border-color:var(--fill-strong);}
  .btn-primary{background:var(--fill-strong); color:var(--fill-strong-text); border-color:var(--fill-strong);}
  .btn-primary:hover{background:transparent; color:var(--text); border-color:var(--border-strong);}
  .btn-sm{padding:6px 14px; font-size:12px;}
  .btn:disabled{opacity:.45; cursor:default; background:transparent; color:var(--text);}

  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:10.5px; text-transform:uppercase; letter-spacing:.2em; color:var(--text-faint); font-weight:400;}
  .field input, .field textarea{
    padding:10px 12px; border:1px solid var(--border-strong); border-radius:var(--radius-sm);
    background:transparent; outline:none; color:var(--text);
  }
  .field select{
    padding:10px 12px; border:1px solid var(--border-strong); border-radius:var(--radius-sm);
    background-color:var(--bg); outline:none; color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(173,183,158,.18);}
  /* Native <select> popups don't inherit the app's theme automatically —
     force a solid, theme-matched background/text everywhere so the open
     dropdown list is never invisible (e.g. white-on-white). */
  select{background-color:var(--bg); color:var(--text);}
  select option{background-color:var(--bg); color:var(--text);}

  .pill-tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .pill-tab{
    padding:6px 14px; border:1px solid var(--border-strong); border-radius:var(--radius-pill);
    font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:400; cursor:pointer;
    background:transparent; color:var(--text-muted); font-family:var(--font);
  }
  .pill-tab.active{background:var(--fill-strong); color:var(--fill-strong-text); border-color:var(--fill-strong);}

  .badge{display:inline-flex; align-items:center; gap:5px; padding:4px 12px; border-radius:var(--radius-pill); font-size:11px; font-weight:400; border:1px solid transparent; background:transparent;}
  .badge-dot{width:6px; height:6px; border-radius:50%;}
  .badge-active{border-color:var(--accent); color:var(--accent-text);}
  .badge-active .badge-dot{background:var(--accent);}
  .badge-dark{background:var(--fill-strong); color:var(--fill-strong-text); border-color:var(--fill-strong);}
  .badge-outline{border-color:var(--border-strong); color:var(--text);}
  .badge-outline .badge-dot{background:var(--stone-light);}
  .badge-amber{border-color:var(--border-strong); color:var(--text-muted);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px;}

  .search-input{
    display:flex; align-items:center; gap:8px; border:1px solid var(--border-strong); border-radius:var(--radius-sm);
    padding:8px 10px; background:var(--surface); color:var(--text-muted); font-size:13px;
  }
  .search-input input{border:none; outline:none; background:transparent; flex:1; color:var(--text); font-size:13px;}
  .kbd{font-size:10px; border:1px solid var(--border-strong); border-radius:4px; padding:1px 5px; color:var(--text-faint);}

  /* scale-ruler progress */
  .ruler{position:relative; height:5px; background:var(--border); border-radius:3px; margin:10px 0 8px;}
  .ruler-fill{position:absolute; top:0; left:0; height:100%; background:var(--accent); border-radius:3px;}
  .ruler-dot{position:absolute; top:50%; width:11px; height:11px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); transform:translate(-50%,-50%); box-shadow:0 0 0 1px var(--accent);}

  /* ---------- shell / sidebar ---------- */
  .shell{display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh; position:relative; z-index:1;}
  .sidebar{border-right:1px solid var(--border); display:flex; flex-direction:column; padding:22px 16px; position:sticky; top:0; height:100vh;}
  .brand{padding:0 4px 20px; margin-bottom:16px; border-bottom:1px solid var(--border);}
  .brand-name{font-size:17px; font-weight:500; letter-spacing:-.01em;}
  .brand-sub{font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-muted); margin-top:2px;}
  .sidebar .search-input{margin-bottom:18px;}
  .nav{display:flex; flex-direction:column; gap:1px;}
  .nav-item{
    display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:var(--radius-sm);
    color:var(--text-muted); font-size:13.5px; font-weight:500; cursor:pointer;
  }
  .nav-item:hover{background:rgba(249,249,249,.06);}
  .nav-item.active{background:rgba(173,183,158,.12); color:var(--accent-text); font-weight:500;}
  .sidebar-spacer{flex:1;}
  .account-widget{display:flex; align-items:center; gap:10px; padding:10px; border-top:1px solid var(--border); margin-top:8px;}
  .avatar{width:30px; height:30px; border-radius:50%; background:var(--fill-strong); color:var(--fill-strong-text); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:400; flex-shrink:0;}
  .account-name{font-size:13px; font-weight:500;}
  .account-role{font-size:11px; color:var(--text-muted);}
  .theme-toggle{
    width:28px; height:28px; border-radius:50%; flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:13px;
    border:1px solid var(--border); color:var(--text-muted); transition:all .15s ease;
  }
  .theme-toggle:hover{border-color:var(--border-strong); color:var(--text);}

  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:28px;}
  .stat-card{border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px;}
  .stat-num{display:block; font-size:32px; font-weight:300; letter-spacing:-.02em; color:var(--text); margin-bottom:4px;}
  .stat-label{font-size:11.5px; color:var(--text-muted);}

  /* planning / timeline — follows the normal app theme like everything
     else (dark by default, light only when the person switches to light
     mode). Structure/spacing modeled closely on the studio's own
     planning-tool reference: per-day hairline gridlines, weekend shading,
     dashed "today" line, flexible day columns that fill the available card
     width instead of leaving dead space. */
  .planning-card{border-color:var(--border); box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .timeline-scroll{overflow-x:auto; padding-bottom:4px;}
  .timeline-grid{display:grid; row-gap:2px; column-gap:0; align-items:center; position:relative;}
  .tl-col-border{border-right:1px solid var(--border);}
  .tl-head-month{
    font-size:11px; font-weight:500; color:var(--text); text-align:left;
    padding:0 0 8px 4px; border-bottom:1px solid var(--border); margin-bottom:6px;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis; border-right:1px solid var(--border);
  }
  .tl-head{font-size:10.5px; color:var(--text-faint); text-align:center; padding-bottom:8px;}
  .tl-head.wknd{color:var(--text); font-weight:500;}
  .tl-label-cell{padding:9px 12px 9px 4px; display:flex; flex-direction:column; gap:5px; border-bottom:1px solid var(--border);}
  .tl-proj-name{font-size:13px; font-weight:500; cursor:pointer; line-height:1.35; color:var(--text);}
  .tl-proj-name:hover{color:var(--accent-text);}
  .tl-add-row{
    cursor:pointer; color:var(--text-muted); font-size:12.5px; font-weight:500;
    justify-content:center; flex-direction:row; align-items:center; display:flex; padding:14px;
  }
  .tl-add-row:hover{color:var(--accent-text); background:rgba(173,183,158,.08);}
  .tl-avatars{display:flex; align-items:center; gap:4px;}
  .tl-mini-avatar{
    width:17px; height:17px; border-radius:50%; background:var(--fill-strong); color:var(--fill-strong-text);
    font-size:8px; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .tl-add-member{
    width:17px; height:17px; border-radius:50%; border:1px dashed var(--border-strong); color:var(--text-faint);
    font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; line-height:1;
  }
  .tl-add-member:hover{border-color:var(--accent); color:var(--accent-text);}
  .tl-bar{
    position:relative; background:transparent; border:1px solid var(--accent); color:var(--accent-text);
    border-radius:6px; font-size:10.5px; font-weight:500; height:26px;
    white-space:nowrap; margin:3px 2px; overflow:hidden;
  }
  .tl-bar-segments{display:flex; height:100%; width:100%;}
  .tl-seg{flex:1; background:transparent; border-right:1px solid rgba(128,128,128,.18);}
  .tl-seg:last-child{border-right:none;}
  .tl-seg.done{background:var(--accent);}
  .tl-seg.current{background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent);}
  .tl-bar-label{
    position:absolute; inset:0; display:flex; align-items:center; padding:0 9px;
    pointer-events:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:#000000;
  }
  .tl-today{
    border-left:1.5px dashed var(--text); pointer-events:none; position:relative; z-index:2;
  }
  .tl-today-label{
    position:absolute; top:-2px; left:5px; font-size:10px; font-weight:600; color:var(--text);
    background:var(--bg); padding:0 4px 0 0; white-space:nowrap;
  }
  .tl-today-label::before{content:'●'; font-size:6px; vertical-align:middle; margin-right:3px;}
  .tl-daygrid{border-right:1px solid var(--border); pointer-events:none; z-index:0;}
  .tl-weekend{background:rgba(128,128,128,.07); pointer-events:none; z-index:0;}
  .tl-assign-row{
    display:flex; flex-wrap:wrap; align-items:center; gap:7px; padding:10px 4px 14px;
    border-bottom:1px solid var(--border); margin-bottom:2px;
  }
  .assign-chip{
    font-size:11.5px; padding:5px 11px; border-radius:var(--radius-pill); border:1px solid var(--border-strong);
    color:var(--text-muted); cursor:pointer; transition:all .12s ease; background:transparent;
  }
  .assign-chip:hover{border-color:var(--accent);}
  .assign-chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-text); font-weight:500;}
  .util-bar{height:6px; border-radius:3px; background:var(--border); overflow:hidden;}
  .util-fill{height:100%; background:var(--accent); border-radius:3px; transition:width .2s ease;}
  .util-fill.over{background:#c0654a;}

  .tt-form-row{display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap;}
  .tt-form-row .field{min-width:130px;}
  .tt-form-row .field input, .tt-form-row .field select{width:100%;}

  .main{padding:36px 44px; max-width:1120px;}
  .main-wide{max-width:none;}
  .page-header{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; gap:16px;}
  .page-title{font-size:24px; font-weight:500; letter-spacing:-.01em;}
  .page-meta{font-size:12.5px; color:var(--text-muted); margin-top:4px;}
  .toolbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}

  /* project card (list) */
  .project-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin-bottom:12px; cursor:pointer; transition:border-color .12s;}
  .project-card:hover{border-color:var(--text-faint);}
  .project-card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .project-title{font-size:15.5px; font-weight:500; margin-bottom:3px;}
  .project-sub{font-size:12.5px; color:var(--text-muted);}
  .project-phase-row{display:flex; align-items:center; justify-content:space-between; margin-top:4px;}
  .project-phase-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; font-weight:500; color:var(--accent-text);}

  /* tabs (detail pages) */
  .tabbar{display:flex; gap:22px; border-bottom:1px solid var(--border); margin-bottom:24px;}
  .tabbar-item{padding:0 0 12px; font-size:13.5px; color:var(--text-muted); font-weight:500; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tabbar-item.active{color:var(--text); border-color:var(--accent); font-weight:500;}

  .detail-header{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px;}
  .breadcrumb{font-size:12px; color:var(--text-faint); margin-bottom:10px;}
  .breadcrumb span{cursor:pointer;}
  .breadcrumb span:hover{color:var(--text-muted);}
  .status-meta{display:flex; gap:36px; text-align:right;}
  .status-meta-item .eyebrow{margin-bottom:4px;}

  .two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start;}
  .row-line{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .row-line:last-child{border-bottom:none;}

  /* file dropzones */
  .file-section{margin-bottom:18px;}
  .file-section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .file-section-head .eyebrow{font-size:10.5px;}
  .dropzone{border:1.5px dashed var(--border-strong); border-radius:var(--radius); min-height:64px; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:500;}
  .file-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:14px;}
  .file-thumb{border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; background:transparent;}
  .file-thumb-img{height:100px; background:linear-gradient(135deg,var(--mist),var(--stone-light)); display:flex; align-items:center; justify-content:center; color:#00000055; font-size:22px;}
  .file-thumb-meta{padding:8px 10px; display:flex; align-items:center; justify-content:space-between;}
  .file-thumb-name{font-size:11.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .file-thumb-size{font-size:10.5px; color:var(--text-faint);}

  /* messages */
  .msg-box{display:flex; gap:10px;}
  .msg-box textarea{flex:1; resize:none; min-height:44px;}

  /* planraum */
  .board-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); cursor:pointer;}
  .board-row:hover .project-title{color:var(--accent-text);}
  .whiteboard{position:fixed; inset:0; background:var(--bg); z-index:50; display:flex; flex-direction:column;}
  .wb-toolbar{display:flex; align-items:center; gap:10px; padding:12px 20px; border-bottom:1px solid var(--border); background:var(--surface);}
  .wb-body{flex:1; display:grid; grid-template-columns:1fr 260px; overflow:hidden;}
  .wb-canvas{position:relative; overflow:auto; padding:40px;}
  .wb-render{width:420px; border:1px solid var(--border); box-shadow:0 12px 32px rgba(0,0,0,.5);}
  .wb-render img{width:100%; display:block;}
  .sticky{position:absolute; width:150px; padding:10px 12px; border-radius:4px; font-size:12px; box-shadow:0 3px 10px rgba(0,0,0,.35); color:var(--ink-soft);}
  .sticky-change{background:var(--sage-pale); border:1px solid var(--sage);}
  .sticky-note{background:var(--surface-warm); border:1px solid var(--stone-light);}
  .sticky-label{font-size:9px; text-transform:uppercase; letter-spacing:.06em; font-weight:500; color:var(--moss); margin-bottom:3px;}
  .pin{position:absolute; width:20px; height:20px; border-radius:50% 50% 50% 0; background:var(--accent); transform:rotate(-45deg) translate(-50%,-100%); transform-origin:0 0;}
  .wb-chat{border-left:1px solid var(--border); background:var(--surface); padding:16px; overflow-y:auto;}
  .wb-chat-msg{margin-bottom:14px;}
  .wb-chat-msg .who{font-size:12px; font-weight:500;}
  .wb-chat-msg .time{font-size:10px; color:var(--text-faint); margin-left:6px; font-weight:400;}
  .wb-chat-msg .txt{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
  .wb-chat-msg[draggable], .sticky[draggable]{cursor:grab;}
  .wb-chat-msg[draggable]:active, .sticky[draggable]:active{cursor:grabbing;}
  .wb-drop-zone{
    margin-top:18px; padding:16px 14px; border:1.5px dashed var(--border-strong); border-radius:var(--radius);
    display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center;
    color:var(--text-faint); font-size:11px; line-height:1.4; transition:all .15s ease;
  }
  .wb-drop-zone.drag-over{border-color:var(--accent); background:rgba(173,183,158,.12); color:var(--accent-text); border-style:solid;}
  .wb-drop-zone.drag-success{border-color:var(--accent); background:rgba(173,183,158,.18); color:var(--accent-text); border-style:solid; font-weight:500;}
  .wb-drop-icon{font-size:17px;}

  /* settings */
  .settings-block{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:16px;}
  .settings-block h3{font-size:15px; font-weight:500; margin-bottom:3px;}
  .settings-block > p.muted{font-size:12.5px; margin-bottom:16px;}
  .swatches{display:flex; gap:10px; flex-wrap:wrap;}
  .swatch{display:flex; align-items:center; gap:8px; padding:9px 14px; border:1.5px solid var(--border-strong); border-radius:var(--radius-sm); cursor:pointer; font-size:13px; font-weight:500;}
  .swatch.active{border-color:var(--text);}
  .swatch-dot{width:14px; height:14px; border-radius:50%;}
  .font-swatch{min-width:90px; justify-content:center; font-size:14px;}

  .accent-mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .accent-mode-card{
    display:flex; align-items:center; gap:13px; padding:16px 18px;
    border:1.5px solid var(--border-strong); border-radius:var(--radius); cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .accent-mode-card:hover{background:rgba(173,183,158,.06);}
  .accent-mode-card.active{border-color:var(--text);}
  .accent-mode-dot{width:24px; height:24px; border-radius:50%; flex-shrink:0; border:1px solid rgba(0,0,0,.08);}
  .accent-mode-title{font-weight:500; font-size:13.5px;}

const ACCENTS = {

};

function clamp255(n){ return Math.max(0, Math.min(255, Math.round(n))); }
function hexToRgb(hex){
  hex = (hex||'#ADB79E').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16) || 0;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function rgbToHex({r,g,b}){
  return '#' + [r,g,b].map(v=>clamp255(v).toString(16).padStart(2,'0')).join('');
}
function mixHex(hexA, hexB, weightB){
  const a=hexToRgb(hexA), b=hexToRgb(hexB);
  return rgbToHex({ r:a.r+(b.r-a.r)*weightB, g:a.g+(b.g-a.g)*weightB, b:a.b+(b.b-a.b)*weightB });
}
// Derives readable soft/glow/deep companions from any arbitrary hex, the
// same roles the preset ACCENTS entries carry — so a custom brand color
// works everywhere sage does, on both light and dark backgrounds.
function computeCustomAccent(hex){
  const safe = /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : '#ADB79E';
  return {
    label:'Eigene Farbe', hex:safe,
    soft: mixHex(safe, '#FFFFFF', .78),
    glow: mixHex(safe, '#FFFFFF', .35),
    deep: mixHex(safe, '#000000', .35),
  };
}

  const start = planningWindowStart();
  const days = [];
  for(let i=0;i<PLANNING_DAYS;i++) days.push(new Date(start.getTime() + i*MS_DAY));
  return days;
}
// Groups consecutive days by month for the header row, e.g. { label:'August', count:31 }
function planningMonthGroups(days){
  const groups = [];
  days.forEach(d=>{
    const key = d.getFullYear()+'-'+d.getMonth();
    if(groups.length && groups[groups.length-1].key===key) groups[groups.length-1].count++;
    else groups.push({ key, label:d.toLocaleDateString('de-DE',{month:'long', year:'numeric'}), count:1 });
  });
  return groups;
}
// Clamped grid-column span (1-indexed, +1 offset for the label column)
function barSpan(startStr, endStr){
  const start = planningWindowStart();
  let s = dayOffsetFrom(start, startStr);
  let e = dayOffsetFrom(start, endStr) + 1;
  const clippedStart = s < 0;
  const clippedEnd = e > PLANNING_DAYS;
  s = Math.max(0, Math.min(PLANNING_DAYS, s));
  e = Math.max(0, Math.min(PLANNING_DAYS, e));
  if(e <= s) return null;
  return { colStart: s+2, colEnd: e+2, clippedStart, clippedEnd };
}
function todayColumnIndex(){
  const start = planningWindowStart();
  const off = dayOffsetFrom(start, '2026-08-13');
  if(off < 0 || off >= PLANNING_DAYS) return null;
  return off;
}
function planningGridRowCount(){
  const projectRows = DATA.projects.reduce((sum,p)=> sum + 1 + (state.planningExpanded===p.id?1:0), 0);
  return 2 + projectRows + 1; // month-header row + day-header row + project rows + "add project" row
}

/* ---------------- time tracking helpers ---------------- */
const TT_MONTH_PREFIX = '2026-08';
const TT_TODAY = '2026-08-13';

function currentMember(){
  return DATA.team.find(m=>m.name===DATA.studio.accountName) || DATA.team[0];
}
function countWeekdays(startStr, endStr){
  let count = 0;
  let d = new Date(startStr);
  const end = new Date(endStr);
  while(d <= end){
    const day = d.getDay();
    if(day!==0 && day!==6) count++;
    d = new Date(d.getTime() + MS_DAY);
  }
  return count;
}
function memberTimeStats(member){
  const entries = DATA.timeEntries.filter(e=>e.memberId===member.id && e.date.startsWith(TT_MONTH_PREFIX));
  const ist = entries.reduce((s,e)=>s+e.hours,0);
  const weekdaysSoFar = countWeekdays(TT_MONTH_PREFIX+'-01', TT_TODAY);
  const soll = (member.weeklyHours/5) * weekdaysSoFar;
  const saldo = ist - soll;
  const urlaubGenommen = DATA.absences.filter(a=>a.memberId===member.id && a.type==='urlaub' && a.date.startsWith('2026')).length;
  const krankheitstage = DATA.absences.filter(a=>a.memberId===member.id && a.type==='krankheit' && a.date.startsWith('2026')).length;
  return { ist, soll, saldo, urlaubGenommen, urlaubRest: member.vacationDaysPerYear - urlaubGenommen, krankheitstage, entries };
}
function projectHoursStats(project){
  const logged = DATA.timeEntries.filter(e=>e.projectId===project.id).reduce((s,e)=>s+e.hours,0);
  const budget = project.budgetHours || 0;
  return { logged, budget, pct: budget ? Math.min(100, (logged/budget)*100) : 0 };
}
function fmtHours(n){
  return (Math.round(n*10)/10).toLocaleString('de-DE');
}

  if(state.projectTab==='overview') return renderTabOverview(p);

  if(state.projectTab==='planraum') return renderTabPlanraum(p);
  if(state.projectTab==='details') return renderTabDetails(p);
  return '';
}

/* ================= EVENTS ================= */
function bindEvents(){
  document.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  const le = document.getElementById('loginEmail');
  const lp = document.getElementById('loginPassword');
  if(le) le.addEventListener('input', e=>state.loginEmail=e.target.value);
  if(lp) lp.addEventListener('input', e=>state.loginPassword=e.target.value);
  const nt = document.getElementById('newTaskInput');
  if(nt) nt.addEventListener('input', e=>state.newTaskText=e.target.value);

  const cc = document.getElementById('customAccentColor');
  const ch = document.getElementById('customAccentHex');
  if(cc) cc.addEventListener('input', e=>{ state.customAccentHex = e.target.value; render(); });
  if(ch) ch.addEventListener('change', e=>{
    let v = e.target.value.trim();
    if(v && !v.startsWith('#')) v = '#'+v;
    if(/^#[0-9a-fA-F]{6}$/.test(v)){ state.customAccentHex = v; render(); }
    else { e.target.value = state.customAccentHex; }
  });

  if(!state.authed && le && lp){
    stopLoginDemo();
    const cancel = ()=>stopLoginDemo(true);
    le.addEventListener('focus', cancel, {once:true});
    lp.addEventListener('focus', cancel, {once:true});
    startLoginDemo(le, lp);
  }

  if(state.whiteboardOpen){
    document.querySelectorAll('[data-drag-text]').forEach(el=>{
      el.addEventListener('dragstart', e=>{
        e.dataTransfer.setData('text/plain', el.dataset.dragText);
        e.dataTransfer.effectAllowed = 'copy';
      });
    });
    const dropZone = document.getElementById('wbTaskDrop');
    if(dropZone){
      dropZone.addEventListener('dragover', e=>{ e.preventDefault(); dropZone.classList.add('drag-over'); });
      dropZone.addEventListener('dragleave', ()=> dropZone.classList.remove('drag-over'));
      dropZone.addEventListener('drop', e=>{
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        const text = e.dataTransfer.getData('text/plain');
        if(text){
          const p = currentProject();
          DATA.tasks.unshift({ id:'t'+Date.now(), title:text, tag:'Aus Whiteboard', project:p.title, date:'gerade eben', done:false });
          dropZone.classList.add('drag-success');
          dropZone.querySelector('.wb-drop-text').textContent = '✓ Als Aufgabe ins Projekt übernommen';
          setTimeout(()=>{ if(state.whiteboardOpen) render(); }, 1100);
        }
      });
    }
  }
}

/* ---------------- login screen — ambient typing demo -----------------
   Purely cosmetic: writes into the DOM directly, never touches state,
   and cancels itself the moment the person actually clicks into a field. */
let loginDemoTimers = [];
let loginDemoActive = false;
function stopLoginDemo(clearFields){
  loginDemoActive = false;
  loginDemoTimers.forEach(t=>clearTimeout(t));
  loginDemoTimers = [];
  if(clearFields){
    const le = document.getElementById('loginEmail');
    const lp = document.getElementById('loginPassword');
    if(le && le.dataset.demo){ le.value=''; delete le.dataset.demo; }
    if(lp && lp.dataset.demo){ lp.value=''; delete lp.dataset.demo; }
  }
}
function startLoginDemo(emailEl, pwdEl){
  loginDemoActive = true;
  const demoEmail = 'patrick@studio-boe.de';
  const demoPwd = 12;
  const t = (fn, ms)=>{ const id=setTimeout(()=>{ if(loginDemoActive) fn(); }, ms); loginDemoTimers.push(id); };

  const run = ()=>{
    emailEl.value=''; pwdEl.value=''; emailEl.dataset.demo='1'; pwdEl.dataset.demo='1';
    let i=0;
    const typeEmail = ()=>{
      if(!loginDemoActive) return;
      if(i<=demoEmail.length){ emailEl.value = demoEmail.slice(0,i); i++; t(typeEmail, 55); }
      else t(typePwd, 450);
    };
    let j=0;
    const typePwd = ()=>{
      if(!loginDemoActive) return;
      if(j<=demoPwd){ pwdEl.value = '•'.repeat(j); j++; t(typePwd, 90); }
      else t(pressBtn, 500);
    };
    const pressBtn = ()=>{
      if(!loginDemoActive) return;
      const btn = document.querySelector('[data-act="login"]');
      if(btn){ btn.style.transform='scale(.97)'; t(()=>{ if(btn) btn.style.transform=''; }, 160); }
      t(run, 2600);
    };
    typeEmail();
  };
  t(run, 900);
}

function onAction(e){
  const el = e.currentTarget;
  const act = el.dataset.act;
  const val = el.dataset.val;

  if(act==='lang'){ state.lang = val; render(); }
  else if(act==='toggle-pwd'){ state.pwdVisible = !state.pwdVisible; render(); }
  else if(act==='login'){ state.authed = true; state.view='dashboard'; render(); }
  else if(act==='nav'){ state.view = val; state.whiteboardOpen=false; render(); }
  else if(act==='open-project'){ state.view='project'; state.projectId=val; state.projectTab='overview'; render(); }
  else if(act==='project-tab'){ state.projectTab = val; render(); }
  else if(act==='open-board'){ state.whiteboardOpen = true; render(); }
  else if(act==='close-board'){ state.whiteboardOpen = false; render(); }
  else if(act==='accent-mode'){ state.accentMode = val; render(); }
  else if(act==='font'){ state.font = val; render(); }
  else if(act==='theme-toggle'){ state.theme = state.theme==='dark' ? 'light' : 'dark'; render(); }
  else if(act==='planning-nav'){
    if(val==='reset') state.planningDayOffset = 0;
    else state.planningDayOffset += parseInt(val,10);
    render();
  }
  else if(act==='toggle-planning-project'){
    state.planningExpanded = state.planningExpanded === val ? null : val;
    render();
  }
  else if(act==='toggle-assign'){
    const proj = DATA.projects.find(p=>p.id===el.dataset.proj);
    const mid = el.dataset.member;
    if(proj){
      const i = proj.assignedTeam.indexOf(mid);
      if(i>-1) proj.assignedTeam.splice(i,1);
      else proj.assignedTeam.push(mid);
    }
    render();
  }
  else if(act==='tt-view-member'){ state.ttViewMemberId = val; render(); }
  else if(act==='tt-add-time'){
    const memberSel = document.getElementById('teMember');
    const dateEl = document.getElementById('teDate');
    const projSel = document.getElementById('teProject');
    const hoursEl = document.getElementById('teHours');
    const noteEl = document.getElementById('teNote');
    const hours = parseFloat(hoursEl.value);
    if(memberSel && dateEl.value && hours > 0){
      DATA.timeEntries.push({
        id:'te'+Date.now(), memberId:memberSel.value, date:dateEl.value,
        hours, projectId: projSel.value || null, note: noteEl.value.trim()
      });
      state.ttViewMemberId = memberSel.value;
    }
    render();
  }
  else if(act==='tt-add-absence'){
    const memberSel = document.getElementById('teMember');
    const mid = memberSel ? memberSel.value : currentMember().id;
    DATA.absences.push({ id:'ab'+Date.now(), memberId:mid, date:TT_TODAY, type:val, note:'' });
    state.ttViewMemberId = mid;
    render();
  }
  else if(act==='add-task'){
    if(state.newTaskText && state.newTaskText.trim()){
      const sel = document.getElementById('newTaskProjectSelect');
      const projTitle = sel && sel.value !== 'Kein Projekt' ? sel.value : DATA.projects[0].title;
      DATA.tasks.unshift({ id:'t'+Date.now(), title:state.newTaskText.trim(), tag:'Neu', project:projTitle, date:'gerade eben', done:false });
      state.newTaskText='';
    }
    render();
  }
  else if(act==='new-task-project'){
    const p = currentProject();
    DATA.tasks.unshift({ id:'t'+Date.now(), title:'Neue Aufgabe', tag:'Neu', project:p.title, date:'gerade eben', done:false });
    render();
  }
  else if(act==='new-project'){ /* visual only */ }
}

render();
</script>
