<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>studio.Bō — Kundenportal</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600,700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000;
    --off-white:#F5F5F5;
    --paper:#FCFBF9;
    --accent:#993114;
    --accent-tint:#F1E1D8;
    --accent-tint-2:#F8EEE8;
    --line:#E2DDD4;
    --line-strong:#CFC9BE;
    --muted:#7A756D;
    --muted-2:#A9A399;
    --white:#FFFFFF;
    --ok:#4B6B4F;
    --ok-tint:#E7EDE6;
    --warn:#8A6A2C;
    --warn-tint:#F3E9D6;
    --radius:3px;
    --sidebar-w:236px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Switzer','Inter',-apple-system,'Segoe UI',sans-serif;
    font-weight:300;
    background:var(--off-white);
    color:var(--black);
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,h4{
    font-family:'Switzer','Inter',sans-serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  p{margin:0;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--accent-tint);color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- utility ---------- */
  .eyebrow{
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);font-weight:500;
  }
  .muted{color:var(--muted);}
  .num{font-variant-numeric:tabular-nums;}
  .hairline{border:none;border-top:1px solid var(--line);margin:0;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 20px;border-radius:var(--radius);border:1px solid transparent;
    font-size:13.5px;font-weight:500;letter-spacing:.01em;
    transition:all .15s ease; white-space:nowrap;
  }
  .btn-primary{background:var(--black);color:var(--off-white);}
  .btn-primary:hover{background:var(--accent);}
  .btn-secondary{background:transparent;color:var(--black);border-color:var(--line-strong);}
  .btn-secondary:hover{border-color:var(--black);}
  .btn-accent{background:var(--accent);color:var(--white);}
  .btn-accent:hover{background:#7a2810;}
  .btn-ghost{background:transparent;color:var(--muted);padding:8px 10px;}
  .btn-ghost:hover{color:var(--black);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 14px;font-size:12.5px;}

  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;
    border-radius:20px;font-size:11.5px;font-weight:500;letter-spacing:.01em;
    border:1px solid var(--line);
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .badge.status-request .dot{background:var(--muted-2);}
  .badge.status-review .dot{background:var(--warn);}
  .badge.status-progress .dot{background:var(--accent);}
  .badge.status-progress{border-color:var(--accent-tint-2);background:var(--accent-tint-2);color:var(--accent);}
  .badge.status-progress .dot{background:var(--accent);}
  .badge.status-waiting{border-color:var(--warn-tint);background:var(--warn-tint);color:var(--warn);}
  .badge.status-waiting .dot{background:var(--warn);}
  .badge.status-done{border-color:var(--ok-tint);background:var(--ok-tint);color:var(--ok);}
  .badge.status-done .dot{background:var(--ok);}
  .badge.status-neutral{color:var(--muted);}

  /* ---------- login ---------- */
  .login-screen{
    min-height:100vh;display:grid;grid-template-columns:1fr 1fr;
  }
  .login-left{
    display:flex;flex-direction:column;justify-content:space-between;
    padding:56px 64px;background:var(--off-white);position:relative;
  }
  .login-right{
    position:relative;overflow:hidden;
    background-size:cover;background-position:center;
  }
  .login-right-overlay{
    position:absolute;inset:0;background:rgba(0,0,0,.56);
  }
  .login-right-content{
    position:relative;z-index:1;height:100%;box-sizing:border-box;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:64px 56px;max-width:560px;
  }
  .login-right-headline{
    font-size:36px;line-height:1.18;font-weight:600;color:#F5F5F5;
    letter-spacing:-0.01em;margin:0 0 18px;
  }
  .login-right-sub{
    font-size:14px;line-height:1.65;color:rgba(245,245,245,.72);margin:0;
  }
  .login-form-wrap{max-width:340px;width:100%;margin:0 auto;}
  .logo-mark{font-size:20px;font-weight:600;letter-spacing:-0.01em;}
  .login-form label{
    display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;margin-top:20px;font-weight:500;
  }
  .login-form input{
    width:100%;padding:13px 14px;border:1px solid var(--line-strong);
    border-radius:var(--radius);background:var(--white);font-size:14px;
    font-family:inherit;color:var(--black);
  }
  .login-form input:focus{border-color:var(--black);}
  .field-row{display:flex;align-items:center;justify-content:space-between;}
  .field-row a{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;}

  /* ---------- shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w);flex:none;background:var(--off-white);
    border-right:1px solid var(--line);padding:28px 20px;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  .sidebar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px;padding:0 4px;}
  .nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius);
    font-size:13.5px;color:var(--muted);font-weight:400;transition:all .12s ease;
  }
  .nav-item svg{flex:none;opacity:.8;}
  .nav-item:hover{background:var(--white);color:var(--black);}
  .nav-item.active{background:var(--black);color:var(--off-white);}
  .nav-item.active svg{opacity:1;}
  .nav-spacer{flex:1;}
  .sidebar-cta{margin:18px 0;}
  .sidebar-foot{border-top:1px solid var(--line);padding-top:16px;display:flex;align-items:center;gap:10px;}
  .avatar{
    width:32px;height:32px;border-radius:50%;background:var(--black);color:var(--off-white);
    display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;flex:none;
  }
  .foot-meta{overflow:hidden;}
  .foot-meta .name{font-size:12.5px;font-weight:500;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;}
  .foot-meta .company{font-size:11px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis;overflow:hidden;}
  .logout-btn{margin-left:auto;color:var(--muted-2);}
  .logout-btn:hover{color:var(--accent);}

  /* ---------- mobile top/tab bars (hidden on desktop) ---------- */
  .mobile-topbar{display:none;}
  .mobile-tabbar{display:none;}
  .avatar-btn{border:none;padding:0;font-family:inherit;-webkit-tap-highlight-color:transparent;}
  .tabbar-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:9px 4px 7px;color:var(--muted-2);font-size:10.5px;font-weight:400;
    -webkit-tap-highlight-color:transparent;
  }
  .tabbar-item svg{width:19px;height:19px;}
  .tabbar-item.active{color:var(--black);font-weight:500;}
  .tabbar-item-cta .tabbar-icon-wrap{
    width:25px;height:25px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;margin-bottom:1px;
  }
  .tabbar-item-cta .tabbar-icon-wrap svg{width:12px;height:12px;}

  .main{flex:1;min-width:0;padding:44px 56px 90px;max-width:1180px;}
  .topline{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:36px;flex-wrap:wrap;gap:12px;}
  .page-title{font-size:26px;}
  .breadcrumb{font-size:12.5px;color:var(--muted-2);margin-bottom:10px;}
  .breadcrumb a:hover{color:var(--accent);}

  /* ---------- dashboard ---------- */
  .greeting{font-size:28px;margin-bottom:6px;}
  .greeting-sub{color:var(--muted);font-size:14.5px;margin-bottom:36px;}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:44px;}
  .stat-cell{background:var(--paper);padding:22px 22px;}
  .stat-num{font-size:30px;font-weight:600;letter-spacing:-0.01em;}
  .stat-label{font-size:12px;color:var(--muted);margin-top:4px;}
  .stat-cell.accent{background:var(--black);color:var(--off-white);}
  .stat-cell.accent .stat-label{color:var(--muted-2);}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .section-head h2{font-size:15px;}
  .section-head .see-all{font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;}
  .section-head .see-all:hover{color:var(--accent);}

  .dash-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;margin-bottom:44px;}

  .proj-row{
    display:grid;grid-template-columns:auto 1fr auto auto;gap:20px;align-items:center;
    padding:18px 20px;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .proj-row:last-child{border-bottom:none;}
  .proj-row:hover{background:var(--accent-tint-2);}
  .proj-row-wide{grid-template-columns:auto 1.6fr auto auto auto;}
  .proj-thumb{width:44px;height:44px;border-radius:2px;background:var(--black);flex:none;display:flex;align-items:center;justify-content:center;}
  .proj-thumb svg{width:26px;height:26px;}
  .proj-name{font-size:14px;font-weight:500;}
  .proj-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .proj-deadline{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;}
  .proj-deadline strong{color:var(--black);font-weight:500;display:block;}

  .todo-list{display:flex;flex-direction:column;}
  .todo-item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);}
  .todo-item:last-child{border-bottom:none;}
  .todo-check{
    width:17px;height:17px;border:1.4px solid var(--line-strong);border-radius:3px;flex:none;margin-top:2px;
    display:flex;align-items:center;justify-content:center;transition:all .12s ease;
  }
  .todo-check:hover{border-color:var(--accent);}
  .todo-check.checked{background:var(--black);border-color:var(--black);}
  .todo-title{font-size:13.5px;}
  .todo-proj{font-size:11.5px;color:var(--muted);margin-top:3px;}

  .empty-note{padding:20px;color:var(--muted);font-size:13px;}

  /* ---------- ruler / timeline signature ---------- */
  .ruler-wrap{padding:26px 4px 54px;}
  .ruler-track{position:relative;height:2px;background:var(--line-strong);margin:0 6px;}
  .ruler-fill{position:absolute;top:0;left:0;height:2px;background:var(--accent);}
  .ruler-step{position:absolute;top:-5px;transform:translateX(-50%);width:12px;height:12px;}
  .ruler-tick{width:2px;height:12px;background:var(--line-strong);margin:0 auto;}
  .ruler-step.past .ruler-tick{background:var(--black);}
  .ruler-step.current .ruler-tick{background:var(--accent);width:2px;height:16px;margin-top:-2px;}
  .ruler-label{position:absolute;top:20px;transform:translateX(-50%);width:120px;text-align:center;font-size:11px;}
  .ruler-label .rl-date{font-weight:500;color:var(--black);}
  .ruler-label .rl-text{color:var(--muted);display:block;margin-top:1px;}
  .ruler-step.current .rl-date{color:var(--accent);}
  .ruler-step.edge-start .ruler-label{left:0;transform:translateX(0);text-align:left;}
  .ruler-step.edge-end .ruler-label{left:auto;right:0;transform:translateX(0);text-align:right;}

  .ruler-mobile{display:none;}
  .rv-track{position:relative;padding-left:2px;}
  .rv-track::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--line-strong);}
  .rv-step{position:relative;display:flex;gap:14px;padding:9px 0;align-items:flex-start;}
  .rv-dot{position:relative;z-index:1;width:11px;height:11px;border-radius:50%;background:var(--off-white);border:1.5px solid var(--line-strong);flex:none;margin-top:3px;}
  .rv-step.past .rv-dot{background:var(--black);border-color:var(--black);}
  .rv-step.current .rv-dot{background:var(--accent);border-color:var(--accent);width:13px;height:13px;margin-top:2px;}
  .rv-date{display:block;font-size:13px;font-weight:500;}
  .rv-step.current .rv-date{color:var(--accent);}
  .rv-label{display:block;font-size:12px;color:var(--muted);margin-top:1px;}

  /* ---------- project detail ---------- */
  .proj-header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:30px;flex-wrap:wrap;}
  .proj-header h1{font-size:25px;margin-bottom:8px;}
  .proj-sub{color:var(--muted);font-size:13.5px;}
  .proj-header-meta{display:flex;gap:28px;flex-wrap:wrap;}
  .phm-item{text-align:left;}
  .phm-label{font-size:11px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;}
  .phm-val{font-size:15px;font-weight:500;}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:32px;overflow-x:auto;}
  .tab{
    padding:12px 16px;font-size:13px;color:var(--muted);white-space:nowrap;
    border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:400;
  }
  .tab:hover{color:var(--black);}
  .tab.active{color:var(--black);border-bottom-color:var(--accent);font-weight:500;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .info-list{display:flex;flex-direction:column;}
  .info-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:12px;}
  .info-row:last-child{border-bottom:none;}
  .info-row .k{color:var(--muted);}
  .info-row .v{font-weight:500;text-align:right;}

  .notice{
    display:flex;gap:12px;padding:16px 18px;border-radius:var(--radius);
    background:var(--warn-tint);border:1px solid #E9DCC0;font-size:13px;line-height:1.55;
  }
  .notice.accent{background:var(--accent-tint-2);border-color:var(--accent-tint);}
  .notice b{font-weight:500;}

  /* ---------- phase list (Übersicht — detaillierter Ablauf) ---------- */
  .phase-list{display:flex;flex-direction:column;}
  .phase-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);}
  .phase-item:last-child{border-bottom:none;}
  .phase-num{
    width:26px;height:26px;border-radius:50%;flex:none;margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:500;border:1.5px solid var(--line-strong);color:var(--muted);
  }
  .phase-item.done .phase-num{background:var(--black);border-color:var(--black);color:var(--off-white);}
  .phase-item.current .phase-num{background:var(--accent);border-color:var(--accent);color:var(--white);}
  .phase-body{flex:1;min-width:0;}
  .phase-title{font-size:13.5px;font-weight:500;}
  .phase-item.upcoming .phase-title{color:var(--muted);}
  .phase-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .phase-item.current .phase-meta{color:var(--accent);font-weight:500;}
  .phase-video{margin-top:10px;}
  .phase-video-note{font-size:11.5px;color:var(--muted-2);margin-top:6px;}

  /* ---------- whiteboard (Reviews) ---------- */
  .wb-overlay{position:fixed;inset:0;z-index:200;background:var(--off-white);display:flex;flex-direction:column;}
  .wb-header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none;
    padding:16px 24px;border-bottom:1px solid var(--line);background:var(--paper);
  }
  .wb-breadcrumb{font-size:11.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
  .wb-title{font-size:17px;}
  .wb-title-sub{font-weight:400;color:var(--muted);}
  .wb-header-actions{display:flex;align-items:center;gap:10px;flex:none;}
  .wb-toolbar{
    display:flex;align-items:center;gap:6px;padding:10px 24px;border-bottom:1px solid var(--line);
    background:var(--white);flex:none;flex-wrap:wrap;
  }
  .wb-tool{padding:8px 14px;border-radius:20px;font-size:12.5px;border:1px solid var(--line-strong);color:var(--muted);background:var(--white);}
  .wb-tool.active{background:var(--black);color:var(--off-white);border-color:var(--black);}
  .wb-tool:hover{border-color:var(--black);}
  .wb-toolbar-sep{width:1px;height:20px;background:var(--line);margin:0 6px;}
  .wb-toolbar-hint{font-size:11.5px;color:var(--muted-2);margin-left:auto;white-space:nowrap;}
  .wb-body{flex:1;display:flex;min-height:0;}
  .wb-board-wrap{flex:1;overflow:auto;position:relative;background:var(--off-white);}
  .wb-board{
    position:relative;height:900px;width:100%;
    background-image:linear-gradient(var(--line) 1px, transparent 1px),linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:32px 32px;
  }
  .wb-board.wb-dragover{outline:2px dashed var(--accent);outline-offset:-2px;background-color:var(--accent-tint-2);}
  .wb-board-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .wb-board-bg svg{width:60%;height:60%;max-width:520px;}
  .wb-canvas{position:absolute;inset:0;cursor:crosshair;}
  .wb-el{position:absolute;cursor:grab;}
  .wb-el.dragging{cursor:grabbing;opacity:.92;z-index:5;}
  .wb-image{border:1px solid var(--line-strong);background:var(--white);padding:4px;border-radius:2px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
  .wb-image img{width:100%;display:block;border-radius:1px;}
  .wb-note{background:#FFF6D8;border:1px solid #E8D89A;border-radius:2px;padding:12px 12px 10px;box-shadow:0 2px 10px rgba(0,0,0,.08);font-size:12.5px;line-height:1.5;}
  .wb-note-text{outline:none;min-height:20px;}
  .wb-el-remove{
    position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;
    background:var(--black);color:var(--off-white);font-size:10px;border:2px solid var(--off-white);
    display:none;align-items:center;justify-content:center;line-height:1;
  }
  .wb-el:hover .wb-el-remove{display:flex;}
  .wb-remote-cursor{position:absolute;display:none;align-items:center;gap:6px;pointer-events:none;z-index:10;transition:left 1.4s ease, top 1.4s ease;left:50%;top:50%;}
  .wb-cursor-arrow{width:0;height:0;border-style:solid;border-width:0 5px 9px 5px;border-color:transparent transparent var(--accent) transparent;transform:rotate(-30deg);}
  .wb-cursor-label{background:var(--accent);color:#fff;font-size:10.5px;padding:3px 8px;border-radius:20px;white-space:nowrap;font-weight:500;}
  .wb-sidebar{width:300px;flex:none;border-left:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;}
  .wb-sidebar-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);}
  .wb-sidebar-head h3{font-size:13.5px;}
  .wb-sidebar-head p{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5;}
  .wb-bullets{flex:1;overflow-y:auto;padding:8px 20px;}
  .wb-bullet{display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);}
  .wb-bullet:last-child{border-bottom:none;}
  .wb-bullet-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;margin-top:6px;}
  .wb-bullet-text{flex:1;font-size:12.5px;line-height:1.5;}
  .wb-bullet button{color:var(--muted-2);font-size:11px;flex:none;}
  .wb-bullet button:hover{color:var(--accent);}
  .wb-bullet-add{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);}
  .wb-bullet-add input{flex:1;padding:9px 11px;border:1px solid var(--line-strong);border-radius:var(--radius);font-size:12.5px;font-family:inherit;}

  /* ---------- task list ---------- */
  .task-toolbar{display:flex;gap:8px;margin-bottom:18px;}
  .pill-filter{
    padding:7px 14px;border-radius:20px;font-size:12.5px;border:1px solid var(--line-strong);color:var(--muted);
  }
  .pill-filter.active{background:var(--black);color:var(--off-white);border-color:var(--black);}
  .task-table-row{
    display:grid;grid-template-columns:20px 1fr auto;gap:16px;align-items:center;
    padding:15px 18px;border-bottom:1px solid var(--line);
  }
  .task-table-row:last-child{border-bottom:none;}
  .task-table-row.done .todo-title{color:var(--muted-2);text-decoration:line-through;}
  .task-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .prio-tag{font-size:10.5px;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;font-weight:500;}
  .prio-hoch{background:var(--accent-tint-2);color:var(--accent);}
  .prio-mittel{background:var(--warn-tint);color:var(--warn);}
  .prio-niedrig{background:var(--line);color:var(--muted);}

  /* ---------- upload / onboarding ---------- */
  .upload-row{
    display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;
    padding:16px 18px;border-bottom:1px solid var(--line);
  }
  .upload-actions{display:flex;align-items:center;gap:12px;}
  .upload-row:last-child{border-bottom:none;}
  .upload-name{font-size:13.5px;font-weight:500;}
  .upload-desc{font-size:11.5px;color:var(--muted);margin-top:2px;}

  /* ---------- files ---------- */
  .file-row{
    display:grid;grid-template-columns:32px 1fr auto;gap:14px;align-items:center;
    padding:14px 18px;border-bottom:1px solid var(--line);
  }
  .file-actions{display:flex;align-items:center;gap:14px;}
  .file-row:last-child{border-bottom:none;}
  .file-icon{width:32px;height:32px;border-radius:2px;background:var(--off-white);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;}
  .file-name{font-size:13.5px;font-weight:500;}
  .file-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .file-group-label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-2);font-weight:500;margin:26px 0 10px;padding:0 2px;}
  .file-group-label:first-child{margin-top:0;}
  .preview-flag{font-size:10px;padding:3px 7px;border-radius:20px;background:var(--warn-tint);color:var(--warn);font-weight:500;letter-spacing:.03em;text-transform:uppercase;}

  /* ---------- review ---------- */
  .review-layout{display:grid;grid-template-columns:1fr 340px;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--white);}
  .review-canvas{position:relative;background:#0e0e0e;min-height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:crosshair;}
  .review-canvas svg{width:100%;height:100%;}
  .pin{
    position:absolute;width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--accent);
    transform:translate(-50%,-100%) rotate(-45deg);display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.4);border:2px solid var(--white);
  }
  .pin span{transform:rotate(45deg);color:var(--white);font-size:11px;font-weight:600;}
  .pin.done{background:var(--muted-2);}
  .review-thumbs{position:absolute;bottom:16px;left:16px;right:16px;display:flex;gap:8px;}
  .rthumb{
    width:50px;height:36px;border-radius:2px;border:2px solid transparent;background:#1c1c1c;
    display:flex;align-items:center;justify-content:center;opacity:.55;
  }
  .rthumb.active{border-color:var(--accent);opacity:1;}
  .rthumb svg{width:24px;height:24px;opacity:.7;}
  .review-side{border-left:1px solid var(--line);display:flex;flex-direction:column;max-height:620px;}
  .review-side-head{padding:18px 20px;border-bottom:1px solid var(--line);}
  .review-side-head h3{font-size:14px;}
  .review-side-head p{font-size:12px;color:var(--muted);margin-top:3px;}
  .comment-filters{display:flex;gap:6px;padding:12px 20px 0;}
  .comment-list{flex:1;overflow-y:auto;padding:8px 20px 16px;}
  .comment-item{padding:14px 0;border-bottom:1px solid var(--line);}
  .comment-item:last-child{border-bottom:none;}
  .comment-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
  .comment-num{font-size:11px;color:var(--white);background:var(--accent);width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-right:7px;}
  .comment-author{font-size:12px;font-weight:500;}
  .comment-time{font-size:11px;color:var(--muted-2);}
  .comment-text{font-size:13px;line-height:1.5;margin-bottom:8px;}
  .comment-item.resolved .comment-text{color:var(--muted-2);}
  .comment-actions{display:flex;gap:14px;}
  .comment-actions button{font-size:11.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;}
  .comment-actions button:hover{color:var(--accent);}
  .comment-compose{border-top:1px solid var(--line);padding:14px 20px;}
  .comment-compose textarea{
    width:100%;border:1px solid var(--line-strong);border-radius:var(--radius);padding:10px 12px;
    font-family:inherit;font-size:13px;resize:none;min-height:56px;
  }
  .hint-row{font-size:11.5px;color:var(--muted-2);margin-top:8px;display:flex;justify-content:space-between;align-items:center;}

  /* ---------- calculator ---------- */
  .step-progress{display:flex;align-items:center;gap:0;margin-bottom:40px;max-width:560px;}
  .step-node{display:flex;align-items:center;gap:10px;}
  .step-dot{
    width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);
    display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);flex:none;background:var(--off-white);
  }
  .step-node.done .step-dot{background:var(--black);border-color:var(--black);color:var(--off-white);}
  .step-node.active .step-dot{background:var(--accent);border-color:var(--accent);color:var(--white);}
  .step-node .step-label{font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .step-node.active .step-label{color:var(--black);font-weight:500;}
  .step-connector{width:52px;height:1px;background:var(--line-strong);margin:0 6px;}

  .type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:40px;}
  .type-card{
    padding:26px 22px;border:1.5px solid var(--line);border-radius:var(--radius);cursor:pointer;
    transition:all .14s ease;background:var(--paper);
  }
  .type-card:hover{border-color:var(--muted-2);}
  .type-card.selected{border-color:var(--accent);background:var(--accent-tint-2);}
  .type-num{font-size:11px;color:var(--muted-2);letter-spacing:.06em;margin-bottom:14px;}
  .type-card.selected .type-num{color:var(--accent);}
  .type-name{font-size:16px;font-weight:600;margin-bottom:10px;line-height:1.3;}
  .type-desc{font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:18px;}
  .type-meta{display:flex;gap:16px;font-size:11.5px;color:var(--muted-2);border-top:1px solid var(--line);padding-top:14px;}

  .service-card{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;background:var(--paper);overflow:hidden;}
  .service-head{display:flex;align-items:center;gap:16px;padding:18px 20px;cursor:pointer;}
  .service-checkbox{
    width:19px;height:19px;border:1.5px solid var(--line-strong);border-radius:4px;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .service-checkbox.checked{background:var(--accent);border-color:var(--accent);}
  .service-title{font-size:14px;font-weight:500;}
  .service-desc{font-size:12px;color:var(--muted);margin-top:2px;}
  .service-price{margin-left:auto;text-align:right;white-space:nowrap;}
  .service-price .p{font-size:14px;font-weight:500;}
  .service-price .d{font-size:11px;color:var(--muted-2);}
  .service-body{border-top:1px solid var(--line);padding:16px 20px 20px 55px;background:var(--white);}
  .qty-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
  .qty-row .ql{font-size:12.5px;}
  .qty-row .ql span{display:block;color:var(--muted);font-size:11px;margin-top:1px;}
  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line-strong);border-radius:20px;overflow:hidden;}
  .stepper button{width:28px;height:28px;background:var(--white);font-size:15px;color:var(--black);}
  .stepper button:hover{background:var(--off-white);}
  .stepper .sv{width:30px;text-align:center;font-size:13px;font-weight:500;}

  .calc-summary-grid{display:grid;grid-template-columns:1fr 340px;gap:28px;}
  .price-line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .price-line .pl-l{color:var(--muted);}
  .price-line .pl-sub{font-size:11px;color:var(--muted-2);margin-top:1px;}
  .price-total{display:flex;justify-content:space-between;padding:18px 0 4px;font-size:17px;font-weight:600;}
  .sticky-summary{position:sticky;top:20px;align-self:start;}
  .summary-card{padding:24px;}
  .summary-card h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:18px;font-weight:500;}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--black);color:var(--off-white);padding:13px 22px;border-radius:var(--radius);
    font-size:13px;opacity:0;transition:all .25s ease;pointer-events:none;z-index:999;display:flex;align-items:center;gap:10px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .fade-in{animation:fadeIn .28s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  @media (max-width:980px){
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .dash-grid{grid-template-columns:1fr;}
    .grid-2{grid-template-columns:1fr;}
    .type-grid{grid-template-columns:1fr;}
    .review-layout{grid-template-columns:1fr;}
    .calc-summary-grid{grid-template-columns:1fr;}
    .review-side{border-left:none;border-top:1px solid var(--line);}
  }

  /* =======================================================================
     Mobile / iPhone — bottom tab bar navigation replaces the sidebar,
     rows restack from grid columns to two-line layouts, the timeline
     ruler switches from a horizontal scale to a vertical one.
     ======================================================================= */
  @media (max-width:760px){
    html,body{overflow-x:hidden;}

    /* ---- shell: sidebar -> fixed top bar + fixed bottom tab bar ---- */
    .shell{display:block;}
    .sidebar{display:none;}
    .mobile-topbar{
      display:flex;align-items:center;justify-content:space-between;
      position:fixed;top:0;left:0;right:0;height:56px;z-index:60;
      padding:env(safe-area-inset-top) 18px 0;
      background:rgba(245,245,245,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .mobile-tabbar{
      display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;
      background:rgba(252,251,249,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
      border-top:1px solid var(--line);
      padding-bottom:env(safe-area-inset-bottom);
    }
    .main{
      max-width:none;
      padding:76px 18px calc(78px + env(safe-area-inset-bottom));
    }
    .toast{bottom:calc(72px + env(safe-area-inset-bottom));max-width:88vw;text-align:center;}

    /* ---- typography / density ---- */
    .page-title{font-size:22px;}
    .greeting{font-size:23px;}
    .greeting-sub{margin-bottom:26px;}
    .proj-header h1{font-size:21px;}
    .stat-num{font-size:24px;}
    .stat-cell{padding:16px 14px;}
    .section-head{margin-bottom:12px;}

    /* ---- project rows: restack thumb/info/chevron + wrap meta below ---- */
    .proj-row{
      position:relative;
      grid-template-columns:auto 1fr !important;
      row-gap:6px;padding:14px 40px 14px 14px;
    }
    .proj-thumb{width:36px;height:36px;}
    .proj-thumb svg{width:20px;height:20px;}
    .proj-info{grid-column:2;}
    .proj-deadline{grid-column:2;text-align:left;white-space:normal;}
    .proj-deadline strong{display:inline;margin-right:6px;}
    .proj-row-wide > .badge{grid-column:2;}
    .proj-chevron{position:absolute;right:12px;top:50%;transform:translateY(-50%);}

    /* ---- task / file / upload rows: two lines instead of five columns ---- */
    .task-table-row{grid-template-columns:20px 1fr;row-gap:6px;padding:14px 16px;}
    .task-meta{grid-column:2;}
    .file-row{grid-template-columns:32px 1fr;row-gap:6px;padding:13px 16px;}
    .file-actions{grid-column:2;justify-content:space-between;}
    .upload-row{grid-template-columns:1fr;row-gap:10px;padding:15px 16px;}
    .upload-actions{justify-content:space-between;}

    /* ---- timeline ruler: horizontal scale -> vertical list ---- */
    .ruler-desktop{display:none;}
    .ruler-mobile{display:block;}

    /* ---- calculator step indicator: compact, labels hidden ---- */
    .step-progress{max-width:none;margin-bottom:28px;}
    .step-connector{width:auto;flex:1;margin:0 4px;}
    .step-label{display:none;}
    .type-card{padding:20px 18px;}
    .service-body{padding:14px 16px 18px;}
    .service-head{padding:16px;gap:12px;}
    .qty-row{gap:10px;}

    /* ---- review tool: shorter canvas, no nested scroll box ---- */
    .review-canvas{min-height:300px;}
    .review-side{max-height:none;}
    .comment-list{overflow-y:visible;max-height:none;}

    /* ---- calculator / quote summary: total shown first on mobile ---- */
    .calc-summary-grid{display:flex;flex-direction:column;}
    .sticky-summary{order:-1;position:static;}

    /* ---- comfortable touch targets ---- */
    .todo-check{width:20px;height:20px;}
    .service-checkbox{width:22px;height:22px;}
    .stepper button{width:32px;height:32px;font-size:17px;}
    .btn{padding:13px 20px;}
    .btn-sm{padding:10px 14px;}

    /* ---- login: single-column, form-first ---- */
    .login-screen{grid-template-columns:1fr;min-height:100vh;}
    .login-right{display:none;}
    .login-left{
      padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      min-height:100vh;
    }

    /* ---- prevent iOS Safari's auto-zoom-on-focus (needs >=16px) ---- */
    .login-form input,
    .comment-compose textarea{font-size:16px;}

    /* ---- whiteboard: stack sidebar below the board, shrink chrome ---- */
    .wb-header{padding:12px 16px;flex-wrap:wrap;}
    .wb-title{font-size:14px;}
    .wb-toolbar{padding:8px 16px;}
    .wb-toolbar-hint{display:none;}
    .wb-body{flex-direction:column;overflow-y:auto;}
    .wb-board{height:420px;}
    .wb-sidebar{width:100%;border-left:none;border-top:1px solid var(--line);max-height:280px;}
  }
</style>

<script>
/* =========================================================================
   studio.Bō — Kundenportal — Klickbarer Prototyp
   Einzeldatei-Prototyp mit gemockten Daten. Kein Backend, kein echter Login.
   ========================================================================= */

/* ---------------------------- Referenzdatum ---------------------------- */
const TODAY = new Date(2026, 6, 24); // 24. Juli 2026

/* ---------------------------- Hilfsfunktionen --------------------------- */
function fmtDate(d, opts){
  if(typeof d === 'string') d = new Date(d);
  return d.toLocaleDateString('de-DE', opts || {day:'2-digit', month:'long'});
}
function fmtDateShort(d){
  if(typeof d === 'string') d = new Date(d);
  return d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtEUR(n){
  return n.toLocaleString('de-DE', {style:'currency', currency:'EUR', maximumFractionDigits:0});
}
function addDays(date, n){
  const d = new Date(date); d.setDate(d.getDate()+n); return d;
}
function addBusinessDays(date, n){
  const d = new Date(date); let added = 0;
  while(added < n){ d.setDate(d.getDate()+1); const day = d.getDay(); if(day!==0 && day!==6) added++; }
  return d;
}
function daysUntil(dateStr){
  const d = new Date(dateStr); const diff = Math.round((d - TODAY)/(1000*60*60*24)); return diff;
}
function relativeDay(dateStr){
  const n = daysUntil(dateStr);
  if(n === 0) return 'heute';
  if(n === 1) return 'morgen';
  if(n === -1) return 'gestern';
  if(n > 1) return `in ${n} Tagen`;
  return `vor ${Math.abs(n)} Tagen`;
}
function initials(name){
  return name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ------------------------------- SVG-Sets -------------------------------
   Abstrakte Strichzeichnungen als Platzhalter für Renderings —

const iconSet = {

function getProject(id){ return PROJECTS.find(p=>p.id===id); }
function activeProject(){ return getProject(state.activeProjectId); }

/* Alle offenen (nicht erledigten) Kundenaufgaben projektübergreifend */
function allOpenTasks(){
  const out = [];
  PROJECTS.forEach(p=>p.tasks.forEach(t=>{ if(!t.done) out.push({...t, project:p}); }));
  return out.sort((a,b)=> new Date(a.due) - new Date(b.due));
}
function allTasks(){
  const out = [];
  PROJECTS.forEach(p=>p.tasks.forEach(t=>out.push({...t, project:p})));
  return out.sort((a,b)=> new Date(a.due) - new Date(b.due));
}
function activeProjects(){ return PROJECTS.filter(p=>p.status!=='abgeschlossen'); }
function requestsInReview(){ return PROJECTS.filter(p=>p.status==='anfrage_pruefung'); }
function quotesAwaitingConfirmation(){ return PROJECTS.filter(p=>p.quote && p.quote.status==='wartet'); }
function newReviewsCount(){
  // Previews die noch offene (nicht erledigte) Kommentare vom Team ohne Kundenreaktion o. schlicht "neu" sind — hier: Projekte mit offener Feedback-Aufgabe
  return PROJECTS.filter(p=>p.tasks.some(t=>!t.done && t.title.toLowerCase().includes('preview'))).length;
}

/* =============================== RENDERING =============================== */

function render(){
  const app = document.getElementById('app');
  if(!state.loggedIn){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }

  let content = '';
  if(state.view === 'dashboard') content = renderDashboard();
  else if(state.view === 'projects') content = renderProjectsList();
  else if(state.view === 'project') content = renderProjectDetail();
  else if(state.view === 'tasks') content = renderTasksGlobal();
  else if(state.view === 'newProject') content = renderNewProject();

  app.innerHTML = renderShell(content);
  attachGlobalEvents();

  stopLiveCursor();
  if(state.whiteboard.open){
    app.insertAdjacentHTML('beforeend', renderWhiteboard());
    restoreWhiteboardCanvas();
    attachWhiteboardEvents();
    if(state.whiteboard.liveActive) startLiveCursor();
  }
}

function renderShell(content){
  const navItem = (view, icon, label) => `
    <div class="nav-item ${state.view===view?'active':''}" data-nav="${view}">
      ${icon}<span>${label}</span>
    </div>`;
  const tabbarItem = (view, icon, label) => `
    <div class="tabbar-item ${state.view===view?'active':''}" data-nav="${view}">${icon}<span>${label}</span></div>`;
  return `
  <div class="mobile-topbar">
    <span class="logo-mark" style="font-size:15.5px;">studio.Bō</span>
    <button class="avatar avatar-btn js-logout" title="Abmelden">${initials(CUSTOMER.name)}</button>
  </div>
  <div class="shell">
    <div class="sidebar">
      <div class="sidebar-top">
        <span class="logo-mark">studio.Bō</span>
      </div>
      <div class="nav-group">
        ${navItem('dashboard', iconSet.dashboard, 'Dashboard')}
        ${navItem('projects', iconSet.projects, 'Projekte')}
        ${navItem('tasks', iconSet.tasks, 'Aufgaben')}
      </div>
      <div class="sidebar-cta">
        <button class="btn btn-accent btn-block" data-nav="newProject">${iconSet.plus}Neues Projekt</button>
      </div>
      <div class="nav-spacer"></div>
      <div class="sidebar-foot">
        <div class="avatar">${initials(CUSTOMER.name)}</div>
        <div class="foot-meta">
          <div class="name">${CUSTOMER.name}</div>
          <div class="company">${CUSTOMER.company}</div>
        </div>
        <button class="btn-ghost logout-btn js-logout" title="Abmelden">${iconSet.logout}</button>
      </div>
    </div>
    <div class="main">${content}</div>
  </div>
  <div class="mobile-tabbar">
    ${tabbarItem('dashboard', iconSet.dashboard, 'Dashboard')}
    ${tabbarItem('projects', iconSet.projects, 'Projekte')}
    ${tabbarItem('tasks', iconSet.tasks, 'Aufgaben')}

/* ------------------------------ Timeline-Ruler ---------------------------- */
function renderRuler(steps, currentKey){
  const dates = steps.map(s=>new Date(s.date).getTime());
  const min = Math.min(...dates), max = Math.max(...dates);
  const n = steps.length;

  // Labels sit at EVEN intervals (index-based), not date-proportional —
  // two milestones just days apart must never crowd their 120px labels
  // into the same space. The progress fill still tracks the real date by
  // interpolating "today" between the two bracketing steps' even slots.
  const evenPct = (i) => n > 1 ? (i/(n-1))*100 : 0;
  let todayPct = 0;
  if(TODAY.getTime() <= min) todayPct = 0;
  else if(TODAY.getTime() >= max) todayPct = 100;
  else{
    let lo = 0;
    for(let i=0;i<n-1;i++){ if(dates[i] <= TODAY.getTime() && TODAY.getTime() <= dates[i+1]){ lo = i; break; } }
    const segSpan = Math.max(dates[lo+1]-dates[lo], 1);
    const ratio = (TODAY.getTime()-dates[lo])/segSpan;
    todayPct = evenPct(lo) + ratio*(evenPct(lo+1)-evenPct(lo));
  }

  const nodes = steps.map((s,i)=>{
    const pct = evenPct(i);
    const isPast = daysUntil(s.date) < 0;
    const isCurrent = s.key === currentKey;
    const edgeCls = i===0 ? 'edge-start' : (i===n-1 ? 'edge-end' : '');
    return `<div class="ruler-step ${isPast?'past':''} ${isCurrent?'current':''} ${edgeCls}" style="left:${pct}%;">
        <div class="ruler-tick"></div>
        <div class="ruler-label"><span class="rl-date">${fmtDate(s.date)}</span><span class="rl-text">${s.label}</span></div>
      </div>`;
  }).join('');
  const vNodes = steps.map(s=>{
    const isPast = daysUntil(s.date) < 0;
    const isCurrent = s.key === currentKey;
    return `<div class="rv-step ${isPast?'past':''} ${isCurrent?'current':''}">
        <div class="rv-dot"></div>
        <div class="rv-content"><span class="rv-date">${fmtDate(s.date)}</span><span class="rv-label">${s.label}</span></div>
      </div>`;
  }).join('');
  return `<div class="ruler-wrap ruler-desktop">
    <div class="ruler-track"><div class="ruler-fill" style="width:${todayPct}%;"></div>${nodes}</div>
  </div>
  <div class="ruler-mobile"><div class="rv-track">${vNodes}</div></div>`;
}

function renderPhaseList(p){
  const idx = p.phaseIndex;
  const notStarted = idx === -1;
  const rows = PHASE_DEFS.map((ph,i)=>{
    const status = i < idx ? 'done' : (i === idx ? 'current' : 'upcoming');
    const dateStr = p.phaseDates[ph.key];
    let meta;
    if(status==='done') meta = dateStr ? `Erledigt am ${fmtDateShort(dateStr)}` : 'Erledigt';
    else if(status==='current') meta = dateStr ? `Läuft seit ${fmtDateShort(dateStr)}` : 'Aktuell in Bearbeitung';
    else meta = dateStr ? `Geplant für ${fmtDateShort(dateStr)}` : 'Ausstehend';
    let videoBlock = '';
    if(ph.video){
      videoBlock = status==='done'
        ? `<div class="phase-video-note">Fand per Videokonferenz statt</div>`
        : `<div class="phase-video"><button class="btn btn-secondary btn-sm" data-request-video="${p.id}|${ph.key}">Videotermin vereinbaren</button></div>`;
    }
    return `<div class="phase-item ${status}">
      <div class="phase-num">${status==='done' ? '✓' : (i+1)}</div>
      <div class="phase-body">
        <div class="phase-title">${ph.label}</div>
        <div class="phase-meta">${meta}</div>
        ${videoBlock}
      </div>
    </div>`;
  }).join('');
  return `
  <div class="phase-list">
    ${notStarted ? `<div class="empty-note" style="padding:0 0 16px;">Die Projektphasen beginnen, sobald das Angebot bestätigt ist.</div>` : ''}
    ${rows}
  </div>`;
}

/* =============================== WHITEBOARD =============================== */

function activeRound(){
  const p = getProject(state.whiteboard.projectId);
  if(!p) return null;
  return p.reviewRounds.find(r=>r.id===state.whiteboard.roundId) || null;
}

function openWhiteboard(pid, rid){
  state.whiteboard.open = true;
  state.whiteboard.projectId = pid;
  state.whiteboard.roundId = rid;
  state.whiteboard.tool = 'select';
  window.addEventListener('mousemove', wbGlobalMouseMove);
  window.addEventListener('mouseup', wbGlobalMouseUp);
  render();
}
function closeWhiteboard(){
  stopLiveCursor();
  window.removeEventListener('mousemove', wbGlobalMouseMove);
  window.removeEventListener('mouseup', wbGlobalMouseUp);
  state.whiteboard.open = false;
  state.whiteboard.liveActive = false;
  render();
}

function wbGlobalMouseMove(e){
  if(wb.dragEl){
    const board = document.getElementById('wbBoard');
    if(!board) return;
    const rect = board.getBoundingClientRect();
    const x = e.clientX - rect.left - wb.dragDX;
    const y = e.clientY - rect.top - wb.dragDY;
    wb.dragEl.style.left = Math.max(0,x) + 'px';
    wb.dragEl.style.top = Math.max(0,y) + 'px';
    return;
  }
  if(wb.drawing && wb.curStroke){
    const canvas = document.getElementById('wbCanvas');
    if(!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const pt = {x:e.clientX-rect.left, y:e.clientY-rect.top};
    const ctx = canvas.getContext('2d');
    const prev = wb.curStroke[wb.curStroke.length-1];
    if(ctx){
      ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=2.5; ctx.strokeStyle='#993114';
      ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(pt.x, pt.y); ctx.stroke();
    }
    wb.curStroke.push(pt);
  }
}
function wbGlobalMouseUp(){
  if(wb.dragEl){
    const [kind, id] = wb.dragEl.getAttribute('data-wb-el').split('|');
    const r = activeRound();
    if(r){
      const list = kind==='image' ? r.board.images : r.board.notes;
      const item = list.find(x=>x.id===id);
      if(item){ item.x = parseFloat(wb.dragEl.style.left)||0; item.y = parseFloat(wb.dragEl.style.top)||0; }
    }
    wb.dragEl.classList.remove('dragging');
    wb.dragEl = null;
  }
  if(wb.drawing){
    if(wb.curStroke && wb.curStroke.length>1){
      const r = activeRound();
      if(r) r.board.strokes.push(wb.curStroke);
    }
    wb.drawing = false; wb.curStroke = null;
  }
}

function handleWbFiles(fileList, x, y){
  const r = activeRound(); if(!r) return;
  const files = Array.from(fileList).filter(f=>f.type.startsWith('image/'));
  if(!files.length){ toast('Bitte eine Bilddatei auswählen'); return; }
  let offset = 0;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      r.board.images.push({id:'img_'+Date.now()+'_'+offset, src:e.target.result, x:Math.max(0,x+offset), y:Math.max(0,y+offset), w:230});
      offset += 26;
      toast('Referenz hinzugefügt');
      render();
    };
    reader.readAsDataURL(file);
  });
}

function startLiveCursor(){
  stopLiveCursor();
  const cursorEl = document.getElementById('wbRemoteCursor');
  const board = document.getElementById('wbBoard');
  if(!cursorEl || !board) return;
  cursorEl.style.display = 'flex';
  function tick(){
    const w = board.clientWidth, h = board.clientHeight;
    const x = 60 + Math.random() * Math.max(40, w - 200);
    const y = 60 + Math.random() * Math.max(40, h - 200);
    cursorEl.style.left = x + 'px';
    cursorEl.style.top = y + 'px';
  }
  tick();
  wb.liveTimer = setInterval(tick, 1500);
}
function stopLiveCursor(){
  if(wb.liveTimer){ clearInterval(wb.liveTimer); wb.liveTimer = null; }
}

function restoreWhiteboardCanvas(){
  const canvas = document.getElementById('wbCanvas');
  const board = document.getElementById('wbBoard');
  if(!canvas || !board) return;
  canvas.width = board.clientWidth;
  canvas.height = board.clientHeight;
  canvas.style.pointerEvents = state.whiteboard.tool === 'pen' ? 'auto' : 'none';
  const r = activeRound();
  if(!r) return;
  const ctx = canvas.getContext('2d');
  if(!ctx) return;
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=2.5; ctx.strokeStyle='#993114';
  r.board.strokes.forEach(stroke=>{
    if(stroke.length<2) return;
    ctx.beginPath(); ctx.moveTo(stroke[0].x, stroke[0].y);
    for(let i=1;i<stroke.length;i++) ctx.lineTo(stroke[i].x, stroke[i].y);
    ctx.stroke();
  });
}

function attachWhiteboardEvents(){
  const closeBtn = document.getElementById('wbClose');
  if(closeBtn) closeBtn.addEventListener('click', closeWhiteboard);

  const liveBtn = document.getElementById('wbToggleLive');
  if(liveBtn) liveBtn.addEventListener('click', ()=>{
    state.whiteboard.liveActive = !state.whiteboard.liveActive;
    if(state.whiteboard.liveActive) toast('Live-Besprechung gestartet — Demo-Cursor aktiv');
    render();
  });

  document.querySelectorAll('[data-wb-tool]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.whiteboard.tool = el.getAttribute('data-wb-tool'); render(); });
  });

  const clearBtn = document.getElementById('wbClearBtn');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    const r = activeRound(); if(!r) return;
    r.board.strokes = [];
    render();
  });

  const bulletAddBtn = document.getElementById('wbBulletAddBtn');
  const bulletInput = document.getElementById('wbBulletInput');
  function addBullet(){
    const r = activeRound(); if(!r || !bulletInput) return;
    const val = (bulletInput.value || '').trim();
    if(!val) return;
    r.bullets.push(val);
    render();
  }
  if(bulletAddBtn) bulletAddBtn.addEventListener('click', addBullet);
  if(bulletInput) bulletInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addBullet(); } });
  document.querySelectorAll('[data-remove-bullet]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const r = activeRound(); if(!r) return;
      r.bullets.splice(parseInt(el.getAttribute('data-remove-bullet')), 1);
      render();
    });
  });

  document.querySelectorAll('[data-remove-wb-el]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const [kind, id] = el.getAttribute('data-remove-wb-el').split('|');
      const r = activeRound(); if(!r) return;
      if(kind==='image') r.board.images = r.board.images.filter(x=>x.id!==id);
      else r.board.notes = r.board.notes.filter(x=>x.id!==id);
      render();
    });
  });

  document.querySelectorAll('.wb-note-text').forEach(el=>{
    el.addEventListener('blur', ()=>{
      const r = activeRound(); if(!r) return;
      const id = el.getAttribute('data-note-id');
      const n = r.board.notes.find(x=>x.id===id);
      if(n) n.text = el.textContent;
    });
  });

  const addRefBtn = document.getElementById('wbAddRefBtn');
  const fileInput = document.getElementById('wbFileInput');
  if(addRefBtn && fileInput){
    addRefBtn.addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', ()=>{
      handleWbFiles(fileInput.files, 40, 40);
      fileInput.value = '';
    });
  }

  const board = document.getElementById('wbBoard');
  const canvas = document.getElementById('wbCanvas');
  if(board){
    board.addEventListener('dragover', (e)=>{ e.preventDefault(); board.classList.add('wb-dragover'); });
    board.addEventListener('dragleave', ()=>{ board.classList.remove('wb-dragover'); });
    board.addEventListener('drop', (e)=>{
      e.preventDefault();
      board.classList.remove('wb-dragover');
      const rect = board.getBoundingClientRect();
      const x = e.clientX - rect.left - 90, y = e.clientY - rect.top - 60;
      if(e.dataTransfer.files && e.dataTransfer.files.length) handleWbFiles(e.dataTransfer.files, x, y);
    });
    board.addEventListener('click', (e)=>{
      if(state.whiteboard.tool !== 'text') return;
      if(e.target.closest('.wb-el')) return;
      const rect = board.getBoundingClientRect();
      const x = e.clientX - rect.left - 110, y = e.clientY - rect.top - 20;
      const r = activeRound(); if(!r) return;
      r.board.notes.push({id:'n_'+Date.now(), x:Math.max(0,x), y:Math.max(0,y), w:220, text:'Neue Notiz …'});
      render();
    });
  }
  if(canvas){
    canvas.addEventListener('mousedown', (e)=>{
      if(state.whiteboard.tool !== 'pen') return;
      const rect = canvas.getBoundingClientRect();
      wb.curStroke = [{x:e.clientX-rect.left, y:e.clientY-rect.top}];
      wb.drawing = true;
    });
  }
  document.querySelectorAll('.wb-el').forEach(el=>{
    el.addEventListener('mousedown', (e)=>{
      if(state.whiteboard.tool !== 'select') return;
      if(e.target.closest('.wb-el-remove') || e.target.isContentEditable) return;
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      wb.dragEl = el; wb.dragDX = e.clientX - rect.left; wb.dragDY = e.clientY - rect.top;
      el.classList.add('dragging');
    });
  });
}

  const previews = p.files.preview, finals = p.files.final;
  const row = (f, isPreview) => `
    <div class="file-row">
      <div class="file-icon">${iconSet.image}</div>
      <div><div class="file-name">${f.name}</div><div class="file-meta">${f.size} · ${fmtDateShort(f.date)}</div></div>
      <div class="file-actions">
        ${isPreview ? `<span class="preview-flag">Nicht final</span>` : `<span></span>`}
        <button class="btn btn-secondary btn-sm" data-download="${f.name}">${iconSet.download}Download</button>
      </div>
    </div>`;
  return `
  ${previews.length ? `<div class="file-group-label">Previews</div><div class="card">${previews.map(f=>row(f,true)).join('')}</div>` : ''}
  ${finals.length ? `<div class="file-group-label">Final</div><div class="card">${finals.map(f=>row(f,false)).join('')}
    <div style="padding:16px 18px;"><button class="btn btn-primary btn-sm" data-download="alle">${iconSet.download}Alle final. Dateien herunterladen</button></div></div>` : ''}
  ${(!previews.length && !finals.length) ? `<div class="card"><div class="empty-note">Für dieses Projekt sind noch keine Dateien verfügbar.</div></div>` : ''}
  `;
}

      <div class="card summary-card">

function tabDetails(p){
  return `
  <div class="grid-2">
    <div class="card info-list" style="padding:6px 20px;">
      <div class="info-row"><span class="k">Projektname</span><span class="v">${p.name}</span></div>
      <div class="info-row"><span class="k">Projektart</span><span class="v">${p.subtitle}</span></div>
      <div class="info-row"><span class="k">Ansprechpartner studio.Bō</span><span class="v">Julia Ahrens</span></div>
      <div class="info-row"><span class="k">Ansprechpartner Kunde</span><span class="v">${CUSTOMER.name}</span></div>
    </div>
    <div class="card info-list" style="padding:6px 20px;">
      <div class="info-row"><span class="k">Projektvolumen</span><span class="v">${fmtEUR(p.volume)}</span></div>
      <div class="info-row"><span class="k">Projekt-ID</span><span class="v">SB-2026-${p.id.slice(1).padStart(3,'0')}</span></div>

/* -------------------------------- Aufgaben (global) ------------------------------- */
function renderTasksGlobal(){
  const list = state.taskFilter === 'offen' ? allOpenTasks() : allTasks();
  return `
  <div class="fade-in">
    <div class="topline"><div class="page-title">Aufgaben</div></div>
    <div class="task-toolbar">
      <div class="pill-filter ${state.taskFilter==='offen'?'active':''}" data-task-filter="offen">Offen</div>
      <div class="pill-filter ${state.taskFilter==='alle'?'active':''}" data-task-filter="alle">Alle</div>
    </div>
    <div class="card">
      ${list.length ? list.map(t=>`
        <div class="task-table-row ${t.done?'done':''}">
          <div class="todo-check ${t.done?'checked':''}" data-toggle-task="${t.project.id}|${t.id}"></div>
          <div><div class="todo-title">${t.title}</div><div class="todo-proj">${t.project.name}</div></div>
          <div class="task-meta">
            <span class="prio-tag prio-${t.priority}">${t.priority}</span>
            <span class="muted" style="font-size:12.5px;">${fmtDateShort(t.due)}</span>
            <span class="muted" style="font-size:12px;">${t.done?'Erledigt':relativeDay(t.due)}</span>
          </div>
        </div>`).join('') : `<div class="empty-note">Keine Aufgaben in dieser Ansicht.</div>`}
    </div>
  </div>`;
}

/* ------------------------------- Neues Projekt / Kalkulation ------------------------------- */
function calcSelectedServices(){
  return Object.entries(state.newProject.services).filter(([,v])=>v.selected).map(([id,v])=>({...SERVICES.find(s=>s.id===id), sel:v}));
}
function calcTotals(){
  const bt = BUILDING_TYPES.find(b=>b.id===state.newProject.buildingType);
  let price = bt ? bt.modelPrice : 0;
  let days = bt ? bt.modelDays : 0;
  const lines = [];
  if(bt) lines.push({label:`3D-Modellierung — Typ ${bt.id}`, price:bt.modelPrice});
  calcSelectedServices().forEach(s=>{
    if(s.type==='viz'){
      const scenes = s.sel.scenes || 0, extra = s.sel.extra || 0;
      if(scenes>0){ price += scenes*s.firstPrice; days += scenes*s.dayFirst; lines.push({label:`${s.name} — ${scenes} neue Szene${scenes>1?'n':''}`, price:scenes*s.firstPrice}); }
      if(extra>0){ price += extra*s.extraPrice; days += extra*s.dayExtra; lines.push({label:`${s.name} — ${extra} weitere Perspektive${extra>1?'n':''}`, price:extra*s.extraPrice}); }
    } else if(s.type==='flat'){
      price += s.price; days += s.days; lines.push({label:s.name, price:s.price});
    } else if(s.type==='sub'){
      price += s.price; lines.push({label:`${s.name} (monatlich)`, price:s.price, sub:`${fmtEUR(s.price)} / ${s.period}`});
    }
  });
  const slot = addBusinessDays(TODAY, 3);
  const finalDate = addBusinessDays(slot, Math.max(days,1));
  const previewDate = addBusinessDays(slot, Math.max(Math.round(days*0.55),1));
  const feedbackDue = addBusinessDays(previewDate, 2);
  return { bt, price, days, lines, slot, previewDate, feedbackDue, finalDate };
}

function renderNewProject(){
  const step = state.newProject.step;
  const steps = [['type','Gebäudetyp'],['services','Leistungen'],['summary','Übersicht']];
  const stepIdx = steps.findIndex(s=>s[0]===step);

  const progress = `<div class="step-progress">
    ${steps.map(([k,l],i)=>`
      ${i>0?`<div class="step-connector"></div>`:''}
      <div class="step-node ${i<stepIdx?'done':''} ${i===stepIdx?'active':''}">
        <div class="step-dot">${i<stepIdx?'✓':i+1}</div><div class="step-label">${l}</div>
      </div>`).join('')}
  </div>`;

  let body = '';
  if(step==='type') body = stepType();
  else if(step==='services') body = stepServices();
  else if(step==='summary') body = stepSummary();

  return `
  <div class="fade-in">
    <div class="breadcrumb"><a data-nav="dashboard">Dashboard</a> / Neues Projekt</div>
    <div class="topline"><div class="page-title">Neues Projekt anfragen</div></div>
    ${progress}
    ${body}
  </div>`;
}

function stepType(){
  return `
  <p class="muted" style="margin-bottom:24px;max-width:560px;">Wählen Sie zunächst den Gebäudetyp. Er bestimmt Modellierungsaufwand, Preis und Bearbeitungszeit.</p>
  <div class="type-grid">
    ${BUILDING_TYPES.map(b=>`
    <div class="type-card ${state.newProject.buildingType===b.id?'selected':''}" data-select-type="${b.id}">
      <div class="type-num">Typ ${b.id}</div>
      <div class="type-name">${b.name}</div>
      <div class="type-desc">${b.desc}</div>
      <div class="type-meta"><span>ab ${fmtEUR(b.modelPrice)}</span><span>ca. ${b.modelDays} Arbeitstage</span></div>
    </div>`).join('')}
  </div>
  <button class="btn btn-primary" id="toServices" ${state.newProject.buildingType?'':'disabled'}>Weiter zu Leistungen</button>`;
}

function stepServices(){
  const totals = calcTotals();
  return `
  <p class="muted" style="margin-bottom:24px;max-width:640px;">Stellen Sie Ihre Leistungen zusammen. Bei Visualisierungen unterscheiden wir zwischen einer neuen Szene und einer weiteren Perspektive eines bereits modellierten Bereichs.</p>
  <div style="max-width:720px;">
    ${SERVICES.map(s=>{
      const sel = state.newProject.services[s.id] || {selected:false, scenes:1, extra:0};
      let priceDisplay = '', dayDisplay = '';
      if(s.type==='viz'){ priceDisplay = `ab ${fmtEUR(s.firstPrice)}`; dayDisplay = `ab ${s.dayFirst} Tage`; }
      else if(s.type==='flat'){ priceDisplay = fmtEUR(s.price); dayDisplay = `${s.days} Tage`; }
      else { priceDisplay = `${fmtEUR(s.price)} / Monat`; dayDisplay = 'Abo'; }
      return `
      <div class="service-card">
        <div class="service-head" data-toggle-service="${s.id}">
          <div class="service-checkbox ${sel.selected?'checked':''}">${sel.selected?'✓':''}</div>
          <div><div class="service-title">${s.name}</div><div class="service-desc">${s.desc}</div></div>
          <div class="service-price"><div class="p">${priceDisplay}</div><div class="d">${dayDisplay}</div></div>
        </div>
        ${sel.selected && s.type==='viz' ? `
        <div class="service-body">
          <div class="qty-row">
            <div class="ql">Neue Szenen / Bereiche<span>je ${fmtEUR(s.firstPrice)}, ca. ${s.dayFirst} Tage</span></div>
            <div class="stepper">
              <button data-qty="${s.id}|scenes|-1">−</button><div class="sv">${sel.scenes}</div><button data-qty="${s.id}|scenes|1">+</button>
            </div>
          </div>
          <div class="qty-row">
            <div class="ql">Weitere Perspektiven<span>je ${fmtEUR(s.extraPrice)}, ca. ${s.dayExtra} Tag</span></div>
            <div class="stepper">
              <button data-qty="${s.id}|extra|-1">−</button><div class="sv">${sel.extra}</div><button data-qty="${s.id}|extra|1">+</button>
            </div>
          </div>
        </div>` : ''}
      </div>`;
    }).join('')}
  </div>
  <div style="display:flex;gap:12px;margin-top:8px;align-items:center;">
    <button class="btn btn-secondary" id="backToType">Zurück</button>
    <button class="btn btn-primary" id="toSummary">Weiter zur Übersicht</button>
    <span class="muted" style="font-size:13px;margin-left:auto;">Zwischensumme: <b style="color:var(--black);">${fmtEUR(totals.price)}</b></span>
  </div>`;
}

function stepSummary(){
  const t = calcTotals();
  return `
  <div class="calc-summary-grid">
    <div>
      <div class="section-head"><h2>Leistungsübersicht</h2></div>
      <div class="card" style="padding:6px 20px;margin-bottom:28px;">
        ${t.lines.map(l=>`<div class="price-line"><span class="pl-l">${l.label}${l.sub?`<div class="pl-sub">${l.sub}</div>`:''}</span><span>${fmtEUR(l.price)}</span></div>`).join('') || `<div class="empty-note">Noch keine Leistungen ausgewählt.</div>`}
        <div class="price-total"><span>Geschätzter Gesamtpreis</span><span>${fmtEUR(t.price)}</span></div>
        <div class="muted" style="font-size:11.5px;padding-bottom:14px;">Unverbindliche Kalkulation. Das endgültige Angebot erstellt studio.Bō nach Prüfung Ihrer Anfrage.</div>
      </div>
      <div class="section-head"><h2>Voraussichtlicher Zeitplan</h2></div>
      <div class="card" style="padding:30px 30px 44px;">
        ${renderRuler([
          {key:'anfrage', label:'Projektanfrage', date:TODAY.toISOString().slice(0,10)},
          {key:'slot', label:'Nächster Produktionsslot', date:t.slot.toISOString().slice(0,10)},
          {key:'preview', label:'Erste Preview', date:t.previewDate.toISOString().slice(0,10)},
          {key:'feedback', label:'Feedback erforderlich bis', date:t.feedbackDue.toISOString().slice(0,10)},
          {key:'final', label:'Geplante Finalisierung', date:t.finalDate.toISOString().slice(0,10)},
        ], 'anfrage')}
      </div>
    </div>
    <div class="sticky-summary">
      <div class="card summary-card">
        <h3>Zusammenfassung</h3>
        <div class="info-row"><span class="k">Gebäudetyp</span><span class="v">Typ ${t.bt ? t.bt.id : '—'}</span></div>
        <div class="info-row"><span class="k">Leistungen</span><span class="v">${calcSelectedServices().length}</span></div>
        <div class="info-row"><span class="k">Produktionszeit</span><span class="v">ca. ${Math.max(t.days,1)} Arbeitstage</span></div>
        <div class="info-row"><span class="k">Geschätzter Preis</span><span class="v">${fmtEUR(t.price)}</span></div>
        <button class="btn btn-accent btn-block" style="margin-top:20px;" id="sendRequest">Anfrage unverbindlich senden</button>
        <button class="btn btn-secondary btn-block" style="margin-top:10px;" id="backToServices">Zurück zu Leistungen</button>
      </div>
    </div>
  </div>`;
}

/* =============================== EVENTS =============================== */

function attachGlobalEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const v = el.getAttribute('data-nav');
      state.view = v;
      if(v==='newProject'){ state.newProject = {step:'type', buildingType:null, services:{}}; }
      if(v==='tasks'){ state.taskFilter='offen'; }
      render();
    });
  });
  document.querySelectorAll('.js-logout').forEach(el=>{
    el.addEventListener('click', ()=>{ state.loggedIn=false; state.view='login'; render(); });
  });

  document.querySelectorAll('[data-open-project]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      state.activeProjectId = el.getAttribute('data-open-project');
      state.activeTab = el.getAttribute('data-tab') || 'overview';
      state.view = 'project';
      render();
    });
  });

  document.querySelectorAll('[data-tab]').forEach(el=>{
    if(el.hasAttribute('data-open-project')) return;
    el.addEventListener('click', ()=>{ state.activeTab = el.getAttribute('data-tab'); render(); });
  });

  document.querySelectorAll('[data-toggle-task]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [pid, tid] = el.getAttribute('data-toggle-task').split('|');
      const proj = getProject(pid); const task = proj.tasks.find(t=>t.id===tid);
      task.done = !task.done;
      toast(task.done ? 'Aufgabe als erledigt markiert' : 'Aufgabe wieder geöffnet');
      render();
    });
  });

  document.querySelectorAll('[data-task-filter]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.taskFilter = el.getAttribute('data-task-filter'); render(); });
  });

  document.querySelectorAll('[data-mock-upload]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [pid, oid] = el.getAttribute('data-mock-upload').split('|');
      const proj = getProject(pid); const item = proj.onboarding.find(o=>o.id===oid);
      item.status = 'pruefung';
      toast('Datei hochgeladen — wird von studio.Bō geprüft');
      render();
    });
  });

  document.querySelectorAll('[data-download]').forEach(el=>{
    el.addEventListener('click', ()=> toast('Download gestartet: ' + el.getAttribute('data-download')));
  });

  document.querySelectorAll('[data-request-video]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [pid, phaseKey] = el.getAttribute('data-request-video').split('|');
      const ph = PHASE_DEFS.find(x=>x.key===phaseKey);
      toast('Terminanfrage gesendet — studio.Bō meldet sich zur Abstimmung des Videotermins für "' + (ph ? ph.label : 'diese Phase') + '"');
    });
  });

  document.querySelectorAll('[data-confirm-quote]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const proj = getProject(el.getAttribute('data-confirm-quote'));
      proj.quote.status = 'bestaetigt';
      proj.quote.confirmedDate = TODAY.toISOString().slice(0,10);
      proj.status = 'onboarding';
      toast('Angebot bestätigt — vielen Dank!');
      render();
    });
  });

  /* Besprechungsrunden — Liste */
  document.querySelectorAll('[data-open-round]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [pid, rid] = el.getAttribute('data-open-round').split('|');
      openWhiteboard(pid, rid);
    });
  });
  const addRoundBtn = document.getElementById('addRoundBtn');
  if(addRoundBtn){
    addRoundBtn.addEventListener('click', ()=>{
      const pid = addRoundBtn.getAttribute('data-add-round');
      const proj = getProject(pid);
      const titleInput = document.getElementById('newRoundTitle');
      const customTitle = (titleInput.value || '').trim();
      const n = proj.reviewRounds.length + 1;
      const id = 'rr_' + Date.now();
      proj.reviewRounds.push({
        id, title: customTitle ? customTitle : `Review ${String(n).padStart(2,'0')}`,
        subtitle: customTitle ? '' : 'Neue Besprechungsrunde', status:'offen', updated: TODAY.toISOString().slice(0,10),
        board:{ bg:proj.kind, images:[], notes:[], strokes:[] }, bullets:[],
      });
      toast('Neue Besprechungsrunde angelegt');
      openWhiteboard(pid, id);
    });
  }

  /* Kalkulator */
  document.querySelectorAll('[data-select-type]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.newProject.buildingType = parseInt(el.getAttribute('data-select-type')); render(); });
  });
  const toServices = document.getElementById('toServices');
  if(toServices) toServices.addEventListener('click', ()=>{ state.newProject.step='services'; render(); });
  const backToType = document.getElementById('backToType');
  if(backToType) backToType.addEventListener('click', ()=>{ state.newProject.step='type'; render(); });
  const toSummary = document.getElementById('toSummary');
  if(toSummary) toSummary.addEventListener('click', ()=>{ state.newProject.step='summary'; render(); });
  const backToServices = document.getElementById('backToServices');
  if(backToServices) backToServices.addEventListener('click', ()=>{ state.newProject.step='services'; render(); });

  document.querySelectorAll('[data-toggle-service]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-toggle-service');
      const cur = state.newProject.services[id] || {selected:false, scenes:1, extra:0};
      cur.selected = !cur.selected;
      state.newProject.services[id] = cur;
      render();
    });
  });
  document.querySelectorAll('[data-qty]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const [id, field, delta] = el.getAttribute('data-qty').split('|');
      const cur = state.newProject.services[id];
      cur[field] = Math.max(field==='scenes'?1:0, (cur[field]||0) + parseInt(delta));
      render();
    });
  });

  const sendRequest = document.getElementById('sendRequest');
  if(sendRequest){
    sendRequest.addEventListener('click', ()=>{
      const t = calcTotals();
      const newId = 'p' + (PROJECTS.length + 1);
      PROJECTS.unshift({
        id:newId, name:'Neue Projektanfrage', subtitle:`Typ ${t.bt?t.bt.id:1} · eingereicht am ${fmtDateShort(TODAY)}`,
        status:'anfrage_pruefung', volume:t.price, kind:'plan',
        timeline:[
          {key:'anfrage', label:'Projektanfrage eingegangen', date:TODAY.toISOString().slice(0,10)},
          {key:'pruefung', label:'Prüfung durch studio.Bō', date:addBusinessDays(TODAY,2).toISOString().slice(0,10)},
        ],
        delayNotice:null, tasks:[], onboarding:[], reviewRounds:[],
        files:{preview:[], final:[]},
        quote:{status:'in_pruefung', sentDate:null, confirmedDate:null, total:t.price, items:t.lines},
      });
      state.view='dashboard';
      toast('Anfrage gesendet — studio.Bō meldet sich in Kürze');
      render();
    });
  }
}

/* --------------------------------- Init --------------------------------- */
render();
</script>
